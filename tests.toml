#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/tests.v1.schema.json

test_format = 1.0

[default]

    # -------------------------------
    # Default args to use for install
    # -------------------------------

    args.language = "en"

    # -------------------------------
    # Commits to test upgrade from
    # -------------------------------

    # No upgrade-from commits: this package was forked from the Drupal core
    # packaging (app id "drupal") when it switched to Drupal CMS. There is no
    # in-place upgrade path from those releases, so there is nothing to test
    # against until the first Drupal CMS release is tagged.
