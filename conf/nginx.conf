#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # NOTE: this uses "root" against a symlink tree (see scripts/install), not
  # "alias". nginx does not reliably resolve try_files against an alias: the
  # fallback produced a bare "index.php" URI, which stopped matching this
  # location, fell through to the domain root and was bounced to the YunoHost
  # SSO. Every non-file URL (admin pages, image derivatives, aggregated CSS)
  # was affected. Do not replace this with "alias".
  root __WEBROOT__;

  index index.php;

  # Common parameter to increase upload size limit in conjunction with dedicated php-fpm file
  client_max_body_size 500M;

  # Drupal 8+ has no "?q=" front controller: anything that is not a real file
  # or directory goes to index.php with the original query string preserved.
  try_files $uri $uri/ __PATH__/index.php?$query_string;

  # Block access to "hidden" files and directories whose names begin with a
  # period. This includes directories used by version control systems such
  # as Subversion or Git to store control files.
  location ~ (^|/)\. {
    return 403;
  }

  # Don't allow direct access to PHP files in the vendor directory.
  location ~ /vendor/.*\.php$ {
    deny all;
    return 404;
  }

  location ~ '[^/]\.php$' {
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    include fastcgi_params_no_auth;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
  }
}
