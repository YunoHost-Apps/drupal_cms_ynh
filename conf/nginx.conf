#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Path to source
  alias __INSTALL_DIR__/web/;

  index index.php;

  # Common parameter to increase upload size limit in conjunction with dedicated php-fpm file
  client_max_body_size 500M;

  # Drupal 8+ (and so Drupal CMS) has no "?q=" front controller: anything that
  # is not a real file or directory is handed to index.php with the original
  # query string preserved. Do not reintroduce a "?q=" rewrite here -- combined
  # with "alias" it loops and keeps appending "&q=" to the URL.
  try_files $uri $uri/ __PATH__/index.php?$query_string;

  location ~ /favicon.ico {
    log_not_found off;
    access_log off;
  }

  location ~ /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
  }

  # Very rarely should these ever be accessed outside of your lan
  location ~* \.(txt|log)$ {
    allow 192.168.0.0/16;
    deny all;
  }

  # Allow "Well-Known URIs" as per RFC 5785
  location ~* ^/.well-known/ {
    allow all;
  }

  # Block access to "hidden" files and directories whose names begin with a
  # period. This includes directories used by version control systems such
  # as Subversion or Git to store control files.
  location ~ (^|/)\. {
    return 403;
  }

  # Don't allow direct access to PHP files in the vendor directory.
  location ~ /vendor/.*\.php$ {
    deny all;
    return 404;
  }

  location ~ '[^/]\.php$|^/update.php' {
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    include fastcgi_params_no_auth;
    # This location is nested inside a location that uses "alias", and nginx
    # does not apply the alias when it builds $document_root for a nested
    # location. Leaving SCRIPT_FILENAME/SCRIPT_NAME at their defaults makes
    # Drupal compute an empty base path, so it emits links like
    # "https://example.euindex.php". Set them explicitly.
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT __INSTALL_DIR__/web;
  }

  # Fighting with Styles? This little gem is amazing.
  location ~ ^__PATH__/sites/.*/files/styles/ {
    try_files $uri __PATH__/index.php?$query_string;
  }

  # Handle private files through Drupal. Private file's path can come
  # with a language prefix.
  location ~ ^__PATH__/(.*/)?system/files/ {
    try_files $uri __PATH__/index.php?$query_string;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    try_files $uri __PATH__/index.php?$query_string;
    expires max;
    log_not_found off;
  }
}
