; Drupal CMS needs considerably more than the YunoHost defaults: the pool was
; coming out at memory_limit 128M and upload_max_filesize 50M, the latter also
; contradicting client_max_body_size 500M in the nginx template.
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 512M
php_admin_value[max_execution_time] = 300
