#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "drupal_cms"
name = "Drupal CMS"
description.en = "Ready-to-use content management platform built on Drupal core"
description.fr = "Plateforme de gestion de contenu prête à l'emploi basée sur Drupal core"

version = "2.1.3~ynh7"

maintainers = ["yalh76"]

[upstream]
license = "GPL-2.0-or-later"
website = "https://new.drupal.org/drupal-cms"
admindoc = "https://new.drupal.org/docs/drupal-cms"
code = "https://git.drupalcode.org/project/cms"
cpe = "cpe:2.3:a:drupal:drupal"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "1500M"
ram.build = "1024M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/drupal-cms"

    [install.init_main_permission]
    type = "group"
    default = "visitors"


    [install.admin]
    type = "user"



[resources]

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "php8.4-fpm",
        "php8.4-cli",
        "php8.4-gd",
        "php8.4-mysql",
        "php8.4-xml",
        "php8.4-ldap",
        "php8.4-mbstring",
        "php8.4-uploadprogress",
        "php8.4-zip",
        "php8.4-opcache",
        "php8.4-apcu",
        "php8.4-json",
        "php8.4-simplexml",
        "php8.4-curl",
        "php8.4-readline",
        "curl",
        "libzip-dev",
        "mariadb-server",
    ]

    [resources.database]
    type = "mysql"

    [resources.composer]
    version = "2.9.8"
